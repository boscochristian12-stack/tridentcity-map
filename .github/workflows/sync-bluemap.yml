name: Sync BlueMap to GitHub Pages

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check for the exaroton API token
        id: token
        env:
          EXAROTON_API_TOKEN: ${{ secrets.EXAROTON_API_TOKEN }}
        run: |
          if [ -n "$EXAROTON_API_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Add the EXAROTON_API_TOKEN repository secret to enable publishing."
          fi

      - name: Set up Node.js
        if: steps.token.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download the BlueMap web files
        if: steps.token.outputs.configured == 'true'
        env:
          EXAROTON_API_TOKEN: ${{ secrets.EXAROTON_API_TOKEN }}
          EXAROTON_SERVER_ADDRESS: "TridentCity.exaroton.me"
        run: node scripts/sync-bluemap.mjs

      - name: Configure GitHub Pages
        if: steps.token.outputs.configured == 'true'
        uses: actions/configure-pages@v5

      - name: Upload the Pages artifact
        if: steps.token.outputs.configured == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        if: steps.token.outputs.configured == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
